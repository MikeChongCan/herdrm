[workspace]
resolver = "2"
members = [
    "herdr-bridge-core",
    "herdr-bridge-pty",
    "herdr-bridge-sys-unix",
    "herdr-bridge-sys-windows",
    "herdr-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/MikeChongCan/herdrm"

[workspace.dependencies]
herdr-bridge-core = { path = "herdr-bridge-core" }
herdr-bridge-pty = { path = "herdr-bridge-pty" }
herdr-bridge-sys-unix = { path = "herdr-bridge-sys-unix" }
herdr-bridge-sys-windows = { path = "herdr-bridge-sys-windows" }

anyhow = "1"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
# GPUI pulls a large dependency graph; keep our own crates fast to rebuild
# while leaving dependencies optimized so the UI stays interactive in debug.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
